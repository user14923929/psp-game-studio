[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketpsp"
version = "0.1.0"
description = "Write Sony PSP homebrew games in a restricted Python DSL compiled to C"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
pocketpsp = "pocketpsp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pocketpsp = ["py.typed", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the PSP SDK and/or PPSSPP (skipped when absent)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
