name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tag must match package versions
        run: |
          python - <<'PY'
          import json, os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          ext = json.load(open("editors/vscode/package.json"))["version"]
          assert tag == py == ext, f"version mismatch: tag={tag} pyproject={py} vscode={ext}"
          PY

      - name: Install and test
        run: |
          pip install -e ".[dev]" build
          ruff check .
          mypy
          pytest -m "not integration"

      - name: Build Python sdist and wheel
        run: python -m build

      - name: Build VS Code extension
        working-directory: editors/vscode
        run: |
          npm install
          npm run compile
          npx --yes @vscode/vsce package --allow-missing-repository

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            editors/vscode/*.vsix
          generate_release_notes: true
